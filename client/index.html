    <!-- Satoshi carries the headlines, General Sans the running text. Same
         foundry, so they share proportions and only the personality changes.

         The indices in f[0]/f[1] are load-bearing. Fontshare's own documented
         `f[]=a&f[]=b` form does not survive two families: it serves the first
         one and then substitutes Clash Display for the second, silently, with
         a 200. Numbering them returns both. -->
    <link href="https://api.fontshare.com/v2/css?f[0]=general-sans@400,500,600&f[1]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
